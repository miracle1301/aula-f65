<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AULA F65 Configurator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='5' width='22' height='14' rx='4' fill='%23111214'/%3E%3Crect x='4' y='8' width='4' height='3' rx='1' fill='%23ff453a'/%3E%3Cpath d='M11 9.5h2M15 9.5h2M7 15h10' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<script>try { const t = localStorage.getItem('aula.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Theme colours (default: dark) ---------- */
:root, :root[data-theme="dark"]{
  color-scheme: dark;
  --bg:rgba(0,0,0,.32); --side:rgba(12,12,18,.38); --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.07); --surface3:rgba(255,255,255,.13);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#f5f5f7; --muted:#a2a3ad; --faint:#6b6d78;
  --inv:#f4f4f5; --inv-text:#0a0a0b;
  --inv-grad:linear-gradient(180deg,#ffffff 0%,#e4e6ee 55%,#c9ccd8 100%);
  --accent:#ffffff; --ok:#32d583; --err:#ff5a5f; --warn:#f5a524;
  --glow:rgba(255,255,255,.08); --dots:rgba(255,255,255,.06);
  --case-a:#2b2c33; --case-b:#16171b; --case-edge:#000; --case-shadow:0 30px 70px rgba(0,0,0,.65);
  --shadow:0 12px 40px rgba(0,0,0,.35);
  --pop:rgba(28,28,38,.55);
  /* liquid glass */
  --mesh:
    radial-gradient(70% 50% at 50% -8%, rgba(255,255,255,.16), transparent 62%),
    radial-gradient(30% 22% at 50% 0%, rgba(255,255,255,.10), transparent 70%),
    linear-gradient(180deg,#121214 0%,#070708 45%,#000 100%);
  --glass:linear-gradient(155deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.045) 42%,rgba(255,255,255,.025) 62%,rgba(255,255,255,.07) 100%);
  --glass-hi:linear-gradient(155deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.12) 100%);
  --ring:linear-gradient(150deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 32%,rgba(255,255,255,.02) 62%,rgba(255,255,255,.28));
  --spec:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04);
  --blur:blur(26px) saturate(180%);
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:rgba(255,255,255,.55); --side:rgba(255,255,255,.4); --surface:rgba(255,255,255,.5); --surface2:rgba(255,255,255,.55); --surface3:rgba(255,255,255,.9);
  --line:rgba(20,20,40,.09); --line2:rgba(20,20,40,.15);
  --text:#0c0c12; --muted:#5f6170; --faint:#9a9caa;
  --inv:#0c0c0e; --inv-text:#fff;
  --inv-grad:linear-gradient(180deg,#3a3b46 0%,#17181e 55%,#050507 100%);
  --accent:#0c0c0e; --ok:#15a34a; --err:#dc2626; --warn:#d97706;
  --glow:rgba(255,255,255,.5); --dots:rgba(20,20,60,.07);
  --case-a:#eceef3; --case-b:#cfd2da; --case-edge:rgba(0,0,0,.12); --case-shadow:0 26px 60px rgba(60,60,110,.22);
  --shadow:0 10px 34px rgba(70,70,130,.12);
  --pop:rgba(255,255,255,.6);
  --mesh:
    radial-gradient(70% 50% at 50% -8%, rgba(255,255,255,1), rgba(255,255,255,0) 62%),
    linear-gradient(180deg,#f3f3f5 0%,#e7e8eb 55%,#dcdde1 100%);
  --glass:linear-gradient(155deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.36) 45%,rgba(255,255,255,.24) 65%,rgba(255,255,255,.5) 100%);
  --glass-hi:linear-gradient(155deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.72) 100%);
  --ring:linear-gradient(150deg,rgba(255,255,255,1),rgba(255,255,255,.45) 35%,rgba(255,255,255,.15) 62%,rgba(255,255,255,.9));
  --spec:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(20,20,60,.04);
  --blur:blur(26px) saturate(170%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Be Vietnam Pro",Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}

/* ---------- App frame ---------- */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}

/* brand */
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 18px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--inv);color:var(--inv-text);display:grid;place-items:center;flex:none}
.brand .t{font-weight:600;font-size:15px;line-height:1.2}
.brand .s{color:var(--muted);font-size:12px}

/* device card */
.devcard{margin:0 12px 6px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.devcard .top{display:flex;align-items:center;gap:8px;font-weight:600}
.devcard .meta{color:var(--muted);font-size:12.5px;margin:3px 0 12px;min-height:19px}
.devcard .btn{width:100%;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.dot.busy{background:var(--warn);animation:blink 1s ease-in-out infinite}
.dot.err{background:var(--err)}
@keyframes blink{50%{opacity:.35}}

/* sidebar menu */
.sgroup{padding:14px 12px 2px}
.sgroup h4{margin:0 8px 6px;font-size:12px;font-weight:500;color:var(--faint)}
.sitem{position:relative;display:flex;align-items:center;gap:11px;width:100%;height:40px;padding:0 10px;border:1px solid transparent;border-radius:10px;background:none;color:var(--muted);font-weight:500;text-align:left}
.sitem:hover{color:var(--text);background:var(--surface2)}
.sitem.on{color:var(--text);background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.sitem.on::before{content:'';position:absolute;left:-13px;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 12px 1px var(--accent)}
.sitem .n{margin-left:auto;min-width:24px;height:22px;padding:0 7px;border-radius:6px;background:var(--surface3);color:var(--text);font-size:12px;font-weight:600;display:grid;place-items:center}
.sitem .n.zero{color:var(--faint);background:none;border:1px solid var(--line)}
.sfoot{margin:auto 12px 14px;padding:12px 14px;border-radius:12px;border:1px dashed var(--line2);color:var(--muted);font-size:12px;line-height:1.5}

/* top bar */
.topbar{flex:none;display:flex;align-items:center;gap:12px;height:60px;padding:0 24px;border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--text);font-weight:500}
.crumb .sep{color:var(--faint)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.lang{display:grid;place-items:center;height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);text-decoration:none}
.lang:hover{color:var(--text);border-color:var(--line2)}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--muted)}
.iconbtn:hover{color:var(--text);border-color:var(--line2);background:var(--surface2)}

/* main scroll area */
.scroll{flex:1;overflow-y:auto;padding:28px 28px 40px}
.wrap{max-width:1180px;margin:0 auto}
.ptitle{margin:0;font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.psub{margin:6px 0 22px;color:var(--muted);max-width:640px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surface2);color:var(--text);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface3)}
.btn.primary{background:var(--inv);border-color:var(--inv);color:var(--inv-text)}
.btn.primary:hover{opacity:.88;background:var(--inv)}
.btn.ghost{background:none}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 35%,transparent);background:color-mix(in srgb,var(--err) 8%,transparent)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- Keyboard card ---------- */
#stage{position:relative;border:1px solid var(--line);border-radius:20px;padding:18px 20px 16px;display:flex;flex-direction:column;align-items:center;overflow:hidden;
  background:radial-gradient(ellipse 70% 60% at 50% 0%,var(--glow),transparent 70%),radial-gradient(var(--dots) 1px,transparent 1.2px) 0 0/18px 18px,var(--surface)}
.layerbar{align-self:stretch;display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;min-height:36px}
.layerbar .lbl{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:11px;background:var(--bg);border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:30px;padding:0 13px;border:none;border-radius:8px;background:none;color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface3);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.seg button .i{color:var(--faint);margin-right:6px}
.case{max-width:100%;overflow-x:auto;scrollbar-width:thin;position:relative;background:linear-gradient(180deg,var(--case-a),var(--case-b));border-radius:18px;padding:14px;box-shadow:var(--case-shadow),inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px var(--case-edge)}
#kb{position:relative}
.key{position:absolute;border-radius:6px;cursor:pointer;transition:transform .08s}
.key .cap{position:absolute;left:4px;right:4px;top:3px;bottom:7px;border-radius:5px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;overflow:hidden}
/* Key legends: one shared font size (--kfs, scaled to the keyboard); only legends that overflow are shrunk.
   translateZ(0) turns off ClearType colour fringing on Windows. */
.key .lbl{display:block;width:100%;font-size:var(--kfs,13px);font-weight:600;letter-spacing:-.01em;line-height:1.2;white-space:pre;overflow:hidden;text-align:center;transform:translateZ(0)}
.key:hover{transform:translateY(-1px)}
.key.alpha{background:#c4c4c6} .key.alpha .cap{background:linear-gradient(#f1f1f2,#e2e2e4);color:#3b3b40}
.key.mod{background:#808189} .key.mod .cap{background:linear-gradient(#acadb4,#9c9da5);color:#202024}
.key.accent{background:#b8533c} .key.accent .cap{background:linear-gradient(#ef8a70,#e27c62);color:#fff}
.key .cap.trns{opacity:.5}
.key .cap.custom .lbl{color:#c2462a} .key.accent .cap.custom .lbl{color:#fff}
.key .cap.layer .lbl{color:#2b63b8}
.key.sel{background:#000;z-index:2;animation:ring 1.2s ease-in-out infinite}
.key.sel .cap{background:linear-gradient(#2a2b30,#141518)!important;color:#fff}
.key.sel .cap .lbl{color:#fff!important}
@keyframes ring{0%,100%{box-shadow:0 0 0 2px var(--accent),0 0 10px 1px color-mix(in srgb,var(--accent) 55%,transparent)}50%{box-shadow:0 0 0 2px var(--accent),0 0 22px 5px color-mix(in srgb,var(--accent) 70%,transparent)}}
.key.was{background:#1f8a55} .key.was .cap{background:#86e0b1;color:#0b2618}
.key.hit{background:#16784a} .key.hit .cap{background:#32d583;color:#05200f}
.key.locked{cursor:not-allowed}
.key.locked .cap::after{content:'';position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.35}
.key.locked:hover{transform:none}
.dim .key{pointer-events:none}
.dim .case{filter:saturate(.3) brightness(.6)}
[data-theme="light"] .dim .case{filter:saturate(.3) brightness(.95) opacity(.55)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:16px}
.overlay .card{pointer-events:auto;background:var(--pop);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:16px;padding:24px 26px;text-align:center;max-width:430px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.overlay h2{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.overlay p{margin:0 0 18px;color:var(--muted)}
.overlay .row{justify-content:center}
.selinfo{margin-top:16px;min-height:22px;color:var(--muted);font-size:13px;text-align:center}
.selinfo b{color:var(--text);font-weight:600}
.progress{position:absolute;left:0;right:0;top:0;height:2px;display:none}
.progress div{height:100%;background:var(--accent);width:0;transition:width .1s;box-shadow:0 0 10px var(--accent)}

/* ---------- Content card ---------- */
#config{margin-top:18px;border:1px solid var(--line);border-radius:20px;background:var(--surface);min-height:300px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.content{min-width:0;display:flex;flex-direction:column;flex:1}
.cats{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:none}
.cats button{position:relative;height:48px;padding:0 12px;border:none;background:none;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.cats button:hover{color:var(--text)}
.cats button.on{color:var(--text)}
.cats button.on::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--text)}
.grid-area{flex:1;min-width:0;padding:18px 20px 26px}
.sec-title{font-size:12.5px;font-weight:500;color:var(--muted);margin:20px 0 9px}
.sec-title:first-child{margin-top:0}
.kgrid{display:flex;flex-wrap:wrap;gap:6px}
.kc{width:58px;height:58px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);color:var(--text);font-size:12px;font-weight:600;letter-spacing:-.01em;line-height:1.2;white-space:pre;overflow:hidden;padding:3px;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transform:translateZ(0)}
.kc:hover{border-color:var(--text);background:var(--surface3)}
.kc.w2{width:122px}
.kc.custom{color:#ffb39f}
[data-theme="light"] .kc.custom{color:#c2462a}
.kc.layer{color:#9cc2ff}
[data-theme="light"] .kc.layer{color:#2b63b8}
.note{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:760px}
.page{flex:1;padding:20px 22px 28px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0 0 6px;font-size:15px;font-weight:600}
.card p{margin:0 0 14px;color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text],input[type=number],textarea{background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;outline:none;min-height:36px}
select:focus,input:focus,textarea:focus{border-color:var(--text)}
input[type=checkbox],input[type=range]{accent-color:var(--accent)}
textarea{width:100%;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:110px}
label.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}

/* macro */
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.mchips button{position:relative;width:52px;height:40px;border-radius:9px;border:1px solid var(--line2);background:var(--surface2);color:var(--muted);font-weight:600}
.mchips button.on{border-color:var(--inv);background:var(--inv);color:var(--inv-text)}
.mchips button.has::after{content:'';position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tokbar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tokbar button{font-size:12px;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:var(--surface2);color:var(--muted)}
.tokbar button:hover{color:var(--text);border-color:var(--text)}
.meter{height:6px;background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px;max-width:340px}
.meter div{height:100%;background:var(--text)}
.rec{color:#fff!important;background:var(--err)!important;border-color:var(--err)!important}
code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--surface3);padding:1px 6px;border-radius:5px}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:var(--pop);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);padding:11px 18px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;z-index:9;box-shadow:0 14px 40px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{border-color:var(--err)}

/* ---------- Liquid glass ---------- */
body{background:var(--mesh);background-attachment:fixed}
.side,.topbar{background:var(--side);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.topbar{background:transparent}
.devcard,#stage,#config,.overlay .card,#toast,.card,.seg,.btn,.sitem.on,.lang,.iconbtn{position:relative;background:var(--glass);box-shadow:var(--spec),var(--shadow);border-color:transparent}
.devcard,#stage,#config,.overlay .card,#toast{backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.btn,.sitem.on,.lang,.iconbtn,.seg{box-shadow:var(--spec)}
.card{box-shadow:var(--spec)}
/* gradient highlight rim, like the edge of glass */
.devcard::after,#stage::after,#config::after,.overlay .card::after,#toast::after,.card::after,.seg::after,.btn::after,.lang::after,.iconbtn::after{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--ring);pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
#stage{background:radial-gradient(ellipse 70% 60% at 50% 0%,var(--glow),transparent 70%),radial-gradient(var(--dots) 1px,transparent 1.2px) 0 0/18px 18px,var(--glass)}
.btn:hover,.lang:hover,.iconbtn:hover{background:var(--glass-hi)}
.btn.primary{background:var(--inv-grad);color:var(--inv-text);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 18px rgba(0,0,0,.25)}
.btn.primary:hover{background:var(--inv-grad);opacity:1;filter:brightness(1.06)}
.btn.danger{background:linear-gradient(155deg,color-mix(in srgb,var(--err) 22%,transparent),color-mix(in srgb,var(--err) 8%,transparent))}
.mark{background:var(--inv-grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 14px rgba(0,0,0,.25)}
.sitem.on{background:var(--glass-hi)}
.seg{background:var(--bg)}
.seg button.on{background:var(--glass-hi);box-shadow:var(--spec),0 2px 8px rgba(0,0,0,.2)}
.sitem .n{background:var(--glass-hi);box-shadow:var(--spec)}
.kc{background:var(--glass);border-color:var(--line2);box-shadow:var(--spec),inset 0 -3px 0 rgba(0,0,0,.12)}
.kc:hover{background:var(--glass-hi)}
.mchips button{background:var(--glass);box-shadow:var(--spec)}
.mchips button.on{background:var(--inv-grad)}
.tokbar button{background:var(--glass);box-shadow:var(--spec)}
.case{box-shadow:var(--case-shadow),inset 0 1px 0 rgba(255,255,255,.18),0 0 0 1px var(--case-edge)}
.sitem.on::before{background:var(--accent)}
[data-theme="light"] .sitem.on::before{box-shadow:none}
.progress div{background:linear-gradient(90deg,var(--faint),var(--text))}
.meter div{background:linear-gradient(90deg,var(--faint),var(--text))}
/* "Not connected" panel and connect button: more solid background + pink-red so text stays readable */
:root[data-theme="dark"]{
  --ov-scrim:rgba(0,0,0,.5);
  --ov-bg:linear-gradient(160deg,rgba(46,46,51,.95) 0%,rgba(18,18,20,.97) 60%,rgba(28,28,31,.96) 100%);
  --ov-muted:#d0d1d6;
  --cta:var(--inv-grad);
  --cta-shadow:0 8px 24px rgba(255,255,255,.12);

/* ====================================================================

   ==================================================================== */
const CMD = { PROTO:0x01, GET_KB:0x02, KM_SET:0x05, KM_GET:0x04, KM_RESET:0x06, LIGHT_SET:0x07, LIGHT_GET:0x08, LIGHT_SAVE:0x09,
  MACRO_COUNT:0x0C, MACRO_SIZE:0x0D, MACRO_GET:0x0E, MACRO_SET:0x0F, MACRO_RESET:0x10, LAYERS:0x11, KM_GETBUF:0x12, UNHANDLED:0xFF };

class HidTransport {
  constructor(dev){
    this.dev = dev; this.queue = Promise.resolve(); this.pending = null;
    this.onReport = e => {
      const d = new Uint8Array(e.data.buffer, e.data.byteOffset, e.data.byteLength);
      const p = this.pending;
      if (p && (d[0] === p.cmd || d[0] === CMD.UNHANDLED)){ this.pending = null; clearTimeout(p.timer); p.resolve(Uint8Array.from(d)); }
    };
    dev.addEventListener('inputreport', this.onReport);
  }
  get name(){ return this.dev.productName || 'HID device'; }
  get vid(){ return this.dev.vendorId; }
  get pid(){ return this.dev.productId; }
  async open(){ if (!this.dev.opened) await this.dev.open(); }
  async close(){ this.dev.removeEventListener('inputreport', this.onReport); try { await this.dev.close(); } catch {} }
  send(bytes){
    const run = () => new Promise((resolve, reject) => {
      const buf = new Uint8Array(32); buf.set(bytes.slice(0, 32));
      const timer = setTimeout(() => { this.pending = null; reject(new Error(`Keyboard did not respond (command 0x${hex(bytes[0])})`)); }, 1200);
      this.pending = { cmd: bytes[0], resolve, timer };
      this.dev.sendReport(0, buf).catch(err => { clearTimeout(timer); this.pending = null; reject(err); });
    });
    const p = this.queue.then(run, run);
    this.queue = p.catch(() => {});
    return p;
  }
}

/* Simulated keyboard — behaves like the real AULA F65 that was tested */
class MockTransport {
  constructor(def){
    this.name = 'AULA F65 (simulated)'; this.vid = 0x258A; this.pid = 0x010C; this.mock = true;
    this.R = def.matrix.rows; this.C = def.matrix.cols; this.L = 4; this.proto = 11;
    this.km = new Uint16Array(this.L * this.R * this.C); this.macro = new Uint8Array(512);
    this.reset();
  }
  reset(){ FACTORY_KEYMAP.forEach((a, l) => a.forEach((v, i) => this.km[l*this.R*this.C + i] = v)); }
  async open(){} async close(){}
  async send(b){
    await sleep(1);
    const r = new Uint8Array(32); r.set(b.slice(0,32));
    switch (b[0]){
      case CMD.PROTO: r[1] = this.proto >> 8; r[2] = this.proto & 0xFF; break;
      case CMD.LAYERS: r[1] = this.L; break;
      case CMD.KM_SET: this.km[(b[1]*this.R + b[2])*this.C + b[3]] = (b[4] << 8) | b[5]; break;
      case CMD.KM_RESET: this.reset(); break;
      case CMD.KM_GETBUF: { const off = (b[1]<<8)|b[2]; for (let i = 0; i < b[3]; i++){ const o = off+i, v = this.km[o>>1]; r[4+i] = (o & 1) ? v & 0xFF : v >> 8; } break; }
      case CMD.MACRO_COUNT: r[1] = 16; break;
      case CMD.MACRO_SIZE: r[1] = this.macro.length >> 8; r[2] = this.macro.length & 0xFF; break;
      case CMD.MACRO_GET: { const off = (b[1]<<8)|b[2]; r.set(this.macro.slice(off, off+b[3]), 4); break; }
      case CMD.MACRO_SET: { const off = (b[1]<<8)|b[2]; this.macro.set(b.slice(4, 4+b[3]), off); break; }
      case CMD.MACRO_RESET: this.macro.fill(0); break;
      default: r[0] = 0xFF;
    }
    return r;
  }
}

const VER = {

       mouse:[['KC_MS_U',0xF0,'Mouse\n↑'],['KC_MS_D',0xF1,'Mouse\n↓'],['KC_MS_L',0xF2,'Mouse\n←'],['KC_MS_R',0xF3,'Mouse\n→'],['KC_BTN1',0xF4,'Left\nclick'],['KC_BTN2',0xF5,'Right\nclick'],['KC_BTN3',0xF6,'Middle\nclick'],['KC_BTN4',0xF7,'Mouse\n4'],['KC_BTN5',0xF8,'Mouse\n5'],['KC_WH_U',0xF9,'Scroll\n↑'],['KC_WH_D',0xFA,'Scroll\n↓'],['KC_WH_L',0xFB,'Scroll\n←'],['KC_WH_R',0xFC,'Scroll\n→'],['KC_ACL0',0xFD,'Accel\n0'],['KC_ACL1',0xFE,'Accel\n1'],['KC_ACL2',0xFF,'Accel\n2']]},
  12: {MT:0x2000, LT:0x4000, TO:0x5200, MO:0x5220, DF:0x5240, TG:0x5260, OSL:0x5280, TT:0x52C0, MACRO:0x7700, MACRO_N:128, USER:0x7E00, GESC:0x7C16,
       mouse:[['KC_MS_U',0xCD,'Mouse\n↑'],['KC_MS_D',0xCE,'Mouse\n↓'],['KC_MS_L',0xCF,'Mouse\n←'],['KC_MS_R',0xD0,'Mouse\n→'],['KC_BTN1',0xD1,'Left\nclick'],['KC_BTN2',0xD2,'Right\nclick'],['KC_BTN3',0xD3,'Middle\nclick'],['KC_BTN4',0xD4,'Mouse\n4'],['KC_BTN5',0xD5,'Mouse\n5'],['KC_WH_U',0xD9,'Scroll\n↑'],['KC_WH_D',0xDA,'Scroll\n↓'],['KC_WH_L',0xDB,'Scroll\n←'],['KC_WH_R',0xDC,'Scroll\n→'],['KC_ACL0',0xDD,'Accel\n0'],['KC_ACL1',0xDE,'Accel\n1'],['KC_ACL2',0xDF,'Accel\n2']]},
};
/* Firmware quirks verified on a real keyboard (wired AULA F65, 258A:010C):
   - reports VIA protocol v11 but uses v12 keycodes (Fn = MO(1) = 0x5221)
   - AULA custom keys = 0x7F00 + index in customKeycodes
   - commands 0x02 (matrix), 0x04 (single-key read), 0x13 (bulk write) never reply
   - VIA lighting commands are not supported */
const PROFILES = {
  '258A:010C': { kcVer: 12, userBase: 0x7F00, noMatrix: true, noLight: true, noSingleRead: true,
                 layerNames: ['Win', 'Win + Fn', 'Mac', 'Mac + Fn'] },
};
const MOD_BITS = {LCTL:0x01, LSFT:0x02, LALT:0x04, LGUI:0x08, RCTL:0x11, RSFT:0x12, RALT:0x14, RGUI:0x18};
const MOD_ALIAS = {C:'LCTL', S:'LSFT', A:'LALT', G:'LGUI', LOPT:'LALT', LCMD:'LGUI', LWIN:'LGUI', ROPT:'RALT', ALGR:'RALT', RCMD:'RGUI', RWIN:'RGUI'};

function buildKC(ver, def, layerCount, userBase){
  const T = {...VER[ver]}; if (userBase != null) T.USER = userBase;
  const list = [], byCode = new Map(), byName = new Map();
  const add = (code, name, label, title, group) => {
    const e = {code, name, label: label ?? name.replace(/^KC_/, ''), title: title || name, group};
    list.push(e); if (!byCode.has(code)) byCode.set(code, e); byName.set(name.toUpperCase(), e); return e;
  };
  const alias = (a, name) => byName.set(a, byName.get(name));
  add(0x00,'KC_NO','','Do nothing (disable the key)','special'); alias('XXXXXXX','KC_NO');
  add(0x01,'KC_TRNS','▽','Transparent — use the key from the layer below','special'); alias('_______','KC_TRNS'); alias('KC_TRANSPARENT','KC_TRNS');
  add(T.GESC,'QK_GESC','Esc\n~','Grave Escape: Esc, or ~ ` while Shift/Win is held','special'); alias('KC_GESC','QK_GESC');
  add(0x29,'KC_ESC','Esc','Escape','basic');
  for (let i = 0; i < 12; i++) add(0x3A+i, 'KC_F'+(i+1), 'F'+(i+1), null, 'basic');
  add(0x35,'KC_GRV','~\n`','` ~ key','basic');
  const shifted = '!@#$%^&*()';
  '1234567890'.split('').forEach((d,i) => add(0x1E+i, 'KC_'+d, `${shifted[i]}\n${d}`, 'Key '+d, 'basic'));
  add(0x2D,'KC_MINS','_\n-',null,'basic'); add(0x2E,'KC_EQL','+\n=',null,'basic'); add(0x2A,'KC_BSPC','Backspace','Backspace','basic');
  add(0x2B,'KC_TAB','Tab',null,'basic');
  for (let i = 0; i < 26; i++){ const ch = String.fromCharCode(65+i); add(0x04+i, 'KC_'+ch, ch, 'Key '+ch, 'basic'); }
  add(0x2F,'KC_LBRC','{\n[',null,'basic'); add(0x30,'KC_RBRC','}\n]',null,'basic'); add(0x31,'KC_BSLS','|\n\\',null,'basic');
  add(0x39,'KC_CAPS','Caps Lock','Caps Lock','basic'); add(0x33,'KC_SCLN',':\n;',null,'basic'); add(0x34,'KC_QUOT','"\n\'',null,'basic');
  add(0x28,'KC_ENT','Enter',null,'basic'); add(0x36,'KC_COMM','<\n,',null,'basic'); add(0x37,'KC_DOT','>\n.',null,'basic');
  add(0x38,'KC_SLSH','?\n/',null,'basic'); add(0x2C,'KC_SPC','Space',null,'basic');
  add(0xE0,'KC_LCTL','Ctrl','Left Ctrl','basic'); add(0xE1,'KC_LSFT','Shift','Left Shift','basic'); add(0xE2,'KC_LALT','Alt','Left Alt','basic'); add(0xE3,'KC_LGUI','Win','Left Windows','basic');
  add(0xE4,'KC_RCTL','R Ctrl','Right Ctrl','basic'); add(0xE5,'KC_RSFT','R Shift','Right Shift','basic'); add(0xE6,'KC_RALT','R Alt','Right Alt','basic'); add(0xE7,'KC_RGUI','R Win','Right Windows','basic');
  add(0x65,'KC_APP','Menu','Menu key (right-click)','basic');
  add(0x52,'KC_UP','↑',null,'basic'); add(0x51,'KC_DOWN','↓',null,'basic'); add(0x50,'KC_LEFT','←',null,'basic'); add(0x4F,'KC_RGHT','→',null,'basic');
  add(0x49,'KC_INS','Ins','Insert','basic'); add(0x4C,'KC_DEL','Del','Delete','basic'); add(0x4A,'KC_HOME','Home',null,'basic'); add(0x4D,'KC_END','End',null,'basic');
  add(0x4B,'KC_PGUP','PgUp','Page Up','basic'); add(0x4E,'KC_PGDN','PgDn','Page Down','basic');
  add(0x46,'KC_PSCR','PrtSc','Print Screen','basic'); add(0x47,'KC_SCRL','ScrLk','Scroll Lock','basic'); add(0x48,'KC_PAUS','Pause',null,'basic');
  [['KC_ENTER','KC_ENT'],['KC_ESCAPE','KC_ESC'],['KC_SPACE','KC_SPC'],['KC_BACKSPACE','KC_BSPC'],['KC_DELETE','KC_DEL'],['KC_RIGHT','KC_RGHT'],['KC_GRAVE','KC_GRV'],['KC_MINUS','KC_MINS'],['KC_EQUAL','KC_EQL'],['KC_SLASH','KC_SLSH'],['KC_COMMA','KC_COMM'],['KC_LCMD','KC_LGUI'],['KC_LWIN','KC_LGUI'],['KC_RCMD','KC_RGUI'],['KC_RWIN','KC_RGUI'],['KC_PSCREEN','KC_PSCR'],['KC_CAPSLOCK','KC_CAPS']].forEach(([a,n]) => alias(a,n));
  add(0x53,'KC_NUM','Num\nLock','Num Lock','numpad'); add(0x54,'KC_PSLS','Num\n/',null,'numpad'); add(0x55,'KC_PAST','Num\n*',null,'numpad');
  add(0x56,'KC_PMNS','Num\n-',null,'numpad'); add(0x57,'KC_PPLS','Num\n+',null,'numpad'); add(0x58,'KC_PENT','Num\nEnter',null,'numpad');
  for (let i = 1; i <= 9; i++) add(0x58+i, 'KC_P'+i, 'Num\n'+i, null, 'numpad');
  add(0x62,'KC_P0','Num\n0',null,'numpad'); add(0x63,'KC_PDOT','Num\n.',null,'numpad'); add(0x67,'KC_PEQL','Num\n=',null,'numpad');
  for (let i = 13; i <= 24; i++) add(0x68+i-13, 'KC_F'+i, 'F'+i, null, 'fext');
  add(0x64,'KC_NUBS','ISO\n\\','ISO \\ key','fext'); add(0x32,'KC_NUHS','ISO\n#','ISO # key','fext');
  add(0x87,'KC_INT1','Ro',null,'fext'); add(0x88,'KC_INT2','Kana',null,'fext'); add(0x89,'KC_INT3','¥',null,'fext');
  add(0x8A,'KC_INT4','Henkan',null,'fext'); add(0x8B,'KC_INT5','Muhen',null,'fext'); add(0x90,'KC_LNG1','Lang1','Hangul/English','fext'); add(0x91,'KC_LNG2','Lang2','Hanja','fext');
  add(0xA8,'KC_MUTE','Mute','Mute','media'); add(0xAA,'KC_VOLD','Vol −','Volume down','media'); add(0xA9,'KC_VOLU','Vol +','Volume up','media');
  add(0xAE,'KC_MPLY','Play\nPause','Play / pause','media'); add(0xAD,'KC_MSTP','Stop','Stop','media');
  add(0xAC,'KC_MPRV','Prev\ntrack','Previous track','media'); add(0xAB,'KC_MNXT','Next\ntrack','Next track','media');
  add(0xBC,'KC_MRWD','Rewind',null,'media'); add(0xBB,'KC_MFFD','Fast\nfwd',null,'media'); add(0xB0,'KC_EJCT','Eject',null,'media');
  add(0xBD,'KC_BRIU','Screen\n+','Screen brightness up','media'); add(0xBE,'KC_BRID','Screen\n−','Screen brightness down','media');
  add(0xB2,'KC_CALC','Calc','Calculator','app'); add(0xB1,'KC_MAIL','Mail',null,'app'); add(0xB3,'KC_MYCM','This\nPC','This PC / My Computer','app');
  add(0xB4,'KC_WSCH','Web\nsearch','Web search','app'); add(0xB5,'KC_WHOM','Web\nhome',null,'app'); add(0xB6,'KC_WBAK','Web\nback',null,'app');
  add(0xB7,'KC_WFWD','Web\nfwd',null,'app'); add(0xB9,'KC_WREF','Web\nrefresh',null,'app'); add(0xBA,'KC_WFAV','Web\nfav',null,'app');
  add(0xA5,'KC_PWR','Power','Power off','app'); add(0xA6,'KC_SLEP','Sleep','Sleep','app'); add(0xA7,'KC_WAKE','Wake',null,'app');
  for (const [n,c,l] of T.mouse) add(c, n, l, null, 'mouse');
  for (let n = 0; n < 16; n++){
    const vis = n < layerCount ? 'layer' : 'layer-hidden';
    add(T.MO+n, `MO(${n})`, `MO(${n})`, `Hold to use layer ${n}`, vis);
    add(T.TG+n, `TG(${n})`, `TG(${n})`, `Toggle layer ${n}`, vis);
    add(T.TO+n, `TO(${n})`, `TO(${n})`, `Switch to layer ${n}`, vis);
    add(T.TT+n, `TT(${n})`, `TT(${n})`, `Hold = layer ${n}, tap repeatedly = toggle it`, vis);
    add(T.OSL+n, `OSL(${n})`, `OSL(${n})`, `Layer ${n} for the next key press only`, vis);
    add(T.DF+n, `DF(${n})`, `DF(${n})`, `Set layer ${n} as the default layer`, vis);
  }
  (def.customKeycodes || []).forEach((c, i) => add(T.USER+i, c.name.toUpperCase().replace(/[^A-Z0-9]+/g,'_'), c.shortName || c.name, c.title || c.name, 'aula'));
  for (let i = 0; i < 64; i++) if (!byCode.has(T.USER+i)) add(T.USER+i, `USER${hex(i)}`, `USER\n${i}`, 'Unnamed custom key', 'user-hidden');
  for (let i = 0; i < T.MACRO_N; i++){ add(T.MACRO+i, `M${i}`, `M${i}`, `Macro ${i}`, 'macro'); alias(`MACRO${i}`, `M${i}`); }
  return {ver, T, list, byCode, byName};
}

function modLabel(m){ const r = m & 0x10 ? 'R' : ''; const p = []; if (m&1) p.push(r+'Ctrl'); if (m&2) p.push(r+'Shift'); if (m&4) p.push(r+'Alt'); if (m&8) p.push(r+'Win'); return p.join('+'); }
function modName(m, inner){ const r = m & 0x10 ? 'R' : 'L'; let s = inner; for (const [b,n] of [[8,'GUI'],[4,'ALT'],[2,'SFT'],[1,'CTL']]) if (m & b) s = `${r}${n}(${s})`; return s; }
function modMask(m){ const r = m & 0x10 ? 'R' : 'L'; return [[1,'CTL'],[2,'SFT'],[4,'ALT'],[8,'GUI']].filter(([b]) => m & b).map(([,n]) => `MOD_${r}${n}`).join('|'); }
const flat = s => s.replace(/\n/g, ' ');

function kcInfo(code){
  const K = S.KC, T = K.T;
  if (K.byCode.has(code)) return K.byCode.get(code);
  const base = code & 0xFF, b = K.byCode.get(base), bn = b ? b.name : `0x${hex(base)}`, bl = b ? b.label.split('\n').pop() : hex(base);
  if (code >= 0x0100 && code <= 0x1FFF){ const m = (code >> 8) & 0x1F; return {code, name: modName(m, bn), label: `${modLabel(m)}\n${bl}`, title: `Combo ${modLabel(m)} + ${bl}`, group:'combo'}; }
  if (code >= T.MT && code < T.MT + 0x2000){ const m = (code >> 8) & 0x1F; return {code, name: `MT(${modMask(m)},${bn})`, label: `${bl}\n${modLabel(m)}`, title: `Tap = ${bl}, hold = ${modLabel(m)}`, group:'combo'}; }
  if (code >= T.LT && code < T.LT + 0x1000){ const n = (code >> 8) & 0x0F; return {code, name: `LT(${n},${bn})`, label: `${bl}\nLT ${n}`, title: `Tap = ${bl}, hold = layer ${n}`, group:'combo'}; }
  return {code, name: `0x${hex(code,4)}`, label: hex(code,4), title: `Unknown code 0x${hex(code,4)}`, group:'unknown'};
}

function splitArgs(s){ const out = []; let depth = 0, cur = ''; for (const ch of s){ if (ch === '(') depth++; if (ch === ')') depth--; if (ch === ',' && depth === 0){ out.push(cur); cur = ''; } else cur += ch; } if (cur.trim()) out.push(cur); return out.map(x => x.trim()); }
function parseMods(s){ let m = 0; for (const p of s.split('|').map(x => x.trim().toUpperCase().replace(/^MOD_/, ''))){ const n = MOD_ALIAS[p] || p; if (MOD_BITS[n] == null) return null; m |= MOD_BITS[n]; } return m; }
function parseKc(str){
  const K = S.KC, T = K.T; const s = String(str).trim(); if (!s) return null;
  if (/^0x[0-9a-f]{1,4}$/i.test(s)) return parseInt(s, 16);
  const up = s.toUpperCase();
  const e = K.byName.get(up) || K.byName.get('KC_' + up); if (e) return e.code;
  const mt = up.match(/^([LR](?:CTL|SFT|ALT|GUI))_T\((.+)\)$/); if (mt){ const k = parseKc(mt[2]); return k != null && k <= 0xFF ? T.MT | (MOD_BITS[mt[1]] << 8) | k : null; }
  const m = up.match(/^([A-Z_]+)\((.*)\)$/); if (!m) return null;
  const fn = MOD_ALIAS[m[1]] || m[1], args = splitArgs(m[2]);
  if (MOD_BITS[fn] != null && args.length === 1){ const k = parseKc(args[0]); if (k == null || k > 0x1FFF) return null; const mm = ((k >> 8) & 0x1F) | MOD_BITS[fn]; return (mm << 8) | (k & 0xFF); }
  if (fn === 'LT' && args.length === 2){ const n = +args[0], k = parseKc(args[1]); return n >= 0 && n < 16 && k != null && k <= 0xFF ? T.LT | (n << 8) | k : null; }
  if (fn === 'MT' && args.length === 2){ const mm = parseMods(args[0]), k = parseKc(args[1]); return mm != null && k != null && k <= 0xFF ? T.MT | (mm << 8) | k : null; }
  if (['M','MACRO'].includes(fn) && args.length === 1){ const n = +args[0]; return n >= 0 && n < T.MACRO_N ? T.MACRO + n : null; }
  return null;
}

/* ====================================================================
   State
   ==================================================================== */
const S = { def: DEFAULT_DEF, keys: [], t: null, profile: {}, proto: 0, layers: 4, layer: 0, keymap: null, sel: null, busy: false, status: '',
  KC: null, kcPref: lsGet('aula.kcVer') || 'auto', macroCount: 0, macroSize: 0, macros: [], macroSel: 0, light: null,
  page: 'configure', menu: 'keymap', cat: 'basic' };

function parseLayout(def){
  const keys = []; let y = 0;
  for (const row of def.layouts.keymap){
    if (!Array.isArray(row) || !row.length) continue;
    let x = 0, p = {w:1, h:1};
    for (const it of row){
      if (it && typeof it === 'object'){
        if (it.x != null) x += it.x; if (it.y != null) y += it.y;
        if (it.w != null) p.w = it.w; if (it.h != null) p.h = it.h;
      } else {
        const lines = String(it).split('\n'), m = lines[0].match(/^(\d+),(\d+)$/);
        const opt = (lines[3] || '').match(/^(\d+),(\d+)$/);
        if (m && (!opt || opt[2] === '0')) keys.push({row:+m[1], col:+m[2], x, y, w:p.w, h:p.h});
        x += p.w; p = {w:1, h:1};
      }
    }
    y += 1;
  }
  return keys;
}
function setDef(def, persist){
  if (!def?.matrix?.rows || !def?.layouts?.keymap) throw new Error('Not a valid VIA definition file (missing matrix/layouts.keymap)');
  S.def = def; S.keys = parseLayout(def);
  if (persist !== undefined) lsSet('aula.def', persist ? JSON.stringify(def) : null);
  rebuildKC();
}
function sniffKeymap(){
  const all = (S.keymap || []).flat().filter(c => c != null);
  const v12 = all.some(c => (c >= 0x5220 && c <= 0x52DF) || (c >= 0x7E00 && c <= 0x7FFF));
  const v10 = all.some(c => c >= 0x5100 && c <= 0x51FF);
  return { kcVer: v12 ? 12 : v10 ? 10 : null, userBase: all.some(c => c >= 0x7F00 && c <= 0x7F3F) ? 0x7F00 : null };
}
function rebuildKC(){
  const sn = S.t ? sniffKeymap() : {};
  const prof = S.t ? S.profile : (PROFILES[`${hex(toInt(S.def.vendorId),4)}:${hex(toInt(S.def.productId),4)}`] || {});
  const ver = S.kcPref !== 'auto' ? +S.kcPref : (prof.kcVer ?? sn.kcVer ?? (S.proto >= 12 ? 12 : 10));
  S.KC = buildKC(ver, S.def, S.layers, prof.userBase ?? sn.userBase ?? null);
}
const isFactoryDef = () => toInt(S.def.vendorId) === 0x258A && toInt(S.def.productId) === 0x010C;
/* keymap on screen: the real keyboard's, or the factory one when not connected */
const viewKeymap = () => S.keymap || (isFactoryDef() ? FACTORY_KEYMAP : null);
const getKc = (l, k, km = viewKeymap()) => km?.[l]?.[k.row * S.def.matrix.cols + k.col];
const connected = () => !!S.t && !!S.keymap;

/* System keys locked by default (AULA F65 only). Remapping them by mistake can lose the Fn layer,
   lose the way to switch wireless / Win-Mac modes, or accidentally create a keyboard-reset key.
   Locked positions follow the factory keymap: Fn (MO) on every layer; on Fn layers: 2.4G, BT1–3, Win, Mac, Reset. */
const LOCK_CODES = new Set([0x7F00, 0x7F01, 0x7F02, 0x7F03, 0x7F04, 0x7F0F, 0x7F12, 0x7F13, 0x7F14]);
const HIDDEN_AULA = ['KEYBOARD_RESET', 'EMI_TEST'];
let unlocked = lsGet('aula.unlock') === '1';
function lockReason(l, k){
  if (unlocked || !isFactoryDef()) return null;
  const c = FACTORY_KEYMAP[l]?.[k.row * 16 + k.col];
  if (c >= 0x5220 && c <= 0x523F) return 'fn';
  if (LOCK_CODES.has(c)) return 'sys';
  return null;
}
const LOCK_MSG = {
  fn: ['The Fn key is locked', 'Changing it removes the Fn layer (connection, lighting, Win/Mac). Unlock it in Settings.'],
  sys: ['System key is locked', 'Locked to avoid changing connection, Win/Mac or Reset by mistake. Unlock it in Settings.'],
};
const isMO = c => c != null && S.KC && c >= S.KC.T.MO && c < S.KC.T.MO + 16;
const layerName = l => (S.t ? S.profile : PROFILES['258A:010C'])?.layerNames?.[l] ?? (l === 0 ? 'Base' : `Layer ${l}`);

  keymap: ['Keymap', 'Pick a key on the keyboard, then choose its new function in the panel below.'],
  macro:  ['Macros', 'Record key sequences or text, then assign a macro to any key.'],
  light:  ['Lighting', 'Backlight effect, colour and brightness.'],
  save:   ['Save + Load', 'Back up the whole keymap and macros to a file, or restore from one.'],
  test:   ['Key Tester', 'Press each key on the real keyboard: keys that register turn green.'],
  settings: ['Settings', 'Device info, keycode table and keyboard definition.'],
};
const curPage = () => S.page === 'configure' ? S.menu : S.page;
/* Number of keys changed from the factory keymap (only available with the built-in AULA F65 definition) */
function changedCount(){
  if (!connected() || !isFactoryDef()) return null;
  let n = 0;
  for (let l = 0; l < S.keymap.length; l++) for (let i = 0; i < S.keymap[l].length; i++) if (FACTORY_KEYMAP[l] && S.keymap[l][i] !== FACTORY_KEYMAP[l][i]) n++;
  return n;
}

  dc.append(el('div', {class:'devcard', title: S.status || ''},
    el('div', {class:'top'}, el('span', {class:'dot ' + kind}), S.t ? S.t.name : S.def.name || 'AULA F65'),
    el('div', {class:'meta'}, meta),
    S.t ? el('button', {class:'btn', onclick: () => disconnect()}, icon('plug', 15), 'Disconnect')
        : 'hid' in navigator ? el('button', {class:'btn primary', onclick: () => connect(false)}, 'Connect keyboard') : null));
  // menu

  const count = id => { const v = id === 'keymap' ? cc : id === 'macro' ? mc : null; return v == null ? null : el('span', {class: 'n' + (v ? '' : ' zero'), title: id === 'keymap' ? 'Keys changed from the factory keymap' : 'Macros with content'}, String(v)); };
  const item = (id, name, onclick) => el('button', {class: 'sitem' + (cur === id ? ' on' : ''), onclick}, icon(id, 18), name, count(id));
  nav.append(
    el('div', {class:'sgroup'}, el('h4', {}, 'Configure'), MENUS.map(([id, name]) => item(id, name, () => { S.menu = id; go('configure'); }))),
    el('div', {class:'sgroup'}, el('h4', {}, 'Tools'), item('test', 'Key Tester', () => go('test')), item('settings', 'Settings', () => go('settings'))));
  // page heading
  const [title, sub] = PAGE_TEXT[cur];
  $('#crumb').replaceChildren(S.page === 'configure' ? 'Configure' : 'Tools', el('span', {class:'sep'}, '/'), el('b', {}, title));
  $('#ptitle').textContent = title; $('#psub').textContent = sub;
}
function setTheme(t){

async function assign(code){

  if (!S.sel) return toast('Click a key on the keyboard first', true);
  const k = S.sel, C = S.def.matrix.cols;

    if (r[0] === CMD.UNHANDLED) throw new Error('The keyboard rejected the key write');

/* Pages opened inside an iframe or app preview pane are usually blocked from WebHID */
let hidBlocked = false;
function hidAllowed(){
  try { const fp = document.permissionsPolicy || document.featurePolicy; if (fp && !fp.allowsFeature('hid')) return false; } catch {}
  return !hidBlocked;
}
async function connect(all){
  if (!('hid' in navigator)) return toast('This browser does not support WebHID', true);
  const filters = all ? [] : [{vendorId: toInt(S.def.vendorId), usagePage: 0xFF60, usage: 0x61}, {usagePage: 0xFF60, usage: 0x61}];
  if (!hidAllowed()){ hidBlocked = true; renderAll(); return toast('This page is open in a preview frame, so USB access is blocked. Open the file in Chrome or Edge.', true); }
  let devs;
  try { devs = await navigator.hid.requestDevice({filters}); }
  catch (e){
    if (/permissions policy|disallowed/i.test(e.message)){ hidBlocked = true; renderAll(); return toast('This page is open in a preview frame, so USB access is blocked. Open the file in Chrome or Edge.', true); }
    return toast(e.message, true);
  }
  if (!devs.length) return;
  const dev = devs.find(d => d.collections.some(c => c.usagePage === 0xFF60)) || devs[0];
  if (!dev.collections.some(c => c.usagePage === 0xFF60)) toast('This device has no VIA configuration interface — communication may fail', true);
  await useTransport(new HidTransport(dev));
}
async function useTransport(t){
  await disconnect(true);
  S.t = t; S.keymap = null; S.sel = null; S.light = null; S.busy = true; S.status = '';
  S.profile = PROFILES[`${hex(t.vid,4)}:${hex(t.pid,4)}`] || {};
  renderAll();
  try {
    await t.open();
    const p = await t.send([CMD.PROTO]);
    if (p[0] === CMD.UNHANDLED) throw new Error('The device does not support the VIA protocol');
    S.proto = (p[1] << 8) | p[2];
    const lc = await t.send([CMD.LAYERS]); S.layers = lc[0] === CMD.UNHANDLED || !lc[1] ? 4 : lc[1];
    S.layer = Math.min(S.layer, S.layers - 1);
    await readKeymap();
    rebuildKC();
    try {
      const mc = await t.send([CMD.MACRO_COUNT]); S.macroCount = mc[0] === CMD.UNHANDLED ? 0 : mc[1];
      if (S.macroCount){ const ms = await t.send([CMD.MACRO_SIZE]); S.macroSize = (ms[1] << 8) | ms[2]; await readMacros(); }
    } catch { S.macroCount = 0; }
    if (!S.profile.noLight) try { await lightProbe(); } catch { S.light = null; }
    S.status = `${t.name} · VIA v${S.proto} · ${S.layers} layers`;
    if (t.mock) toast('Demo mode: changes stay in memory and are not sent to a real keyboard');
  } catch (e){
    S.keymap = null; S.status = 'Error: ' + e.message; toast(e.message, true);
  }
  S.busy = false; progress(null); renderAll();
}
async function disconnect(silent){
  stopTester();
  if (S.t){ const t = S.t; S.t = null; await t.close(); }
  S.keymap = null; S.sel = null; S.macroCount = 0; S.macros = []; S.light = null; S.proto = 0; S.profile = {}; S.layers = 4; S.status = '';
  if (!silent){ rebuildKC(); renderAll(); }
}

async function readKeymap(){
  const {rows: R, cols: C} = S.def.matrix, L = S.layers, total = L*R*C*2;
  const buf = new Uint8Array(total); let ok = true;
  try {
    for (let off = 0; off < total; off += 28){
      const n = Math.min(28, total - off);
      const r = await S.t.send([CMD.KM_GETBUF, off >> 8, off & 0xFF, n]);
      if (r[0] === CMD.UNHANDLED){ ok = false; break; }
      buf.set(r.slice(4, 4 + n), off); progress(off / total);
    }
  } catch { ok = false; }
  const km = Array.from({length: L}, () => new Array(R*C).fill(null));
  if (ok){
    for (let l = 0; l < L; l++) for (let i = 0; i < R*C; i++){ const o = (l*R*C + i)*2; km[l][i] = (buf[o] << 8) | buf[o+1]; }
  } else {
    if (S.profile.noSingleRead) throw new Error('Could not read the keymap');
    let n = 0;
    for (let l = 0; l < L; l++) for (const k of S.keys){
      const r = await S.t.send([CMD.KM_GET, l, k.row, k.col]);
      km[l][k.row*C + k.col] = (r[4] << 8) | r[5]; progress(++n / (L*S.keys.length));
    }
  }
  S.keymap = km;
}

   ==================================================================== */
function macroDecode(bytes){
  const tok = []; let txt = '';
  const flush = () => { if (txt){ tok.push({t:'text', v:txt}); txt = ''; } };
  for (let i = 0; i < bytes.length;){
    const b = bytes[i];

      flush(); const a = bytes[i+1];
      if (a === 4){ let j = i + 2, num = ''; while (j < bytes.length && bytes[j] !== 0x7C) num += String.fromCharCode(bytes[j++]); tok.push({t:'delay', v:num}); i = j + 1; continue; }
      if (a >= 1 && a <= 3){ tok.push({t: ['','tap','down','up'][a], v: bytes[i+2]}); i += 3; continue; }
      i += 2; continue;
    }
    txt += String.fromCharCode(b); i++;
  }
  flush();
  const nm = c => S.KC.byCode.get(c)?.name || `0x${hex(c)}`;
  let out = '';
  for (let i = 0; i < tok.length; i++){
    const t = tok[i];
    if (t.t === 'text'){ out += t.v; continue; }
    if (t.t === 'delay'){ out += `{${t.v}}`; continue; }

}

function toggleRecord(ta, btn){
  if (recording){
    window.removeEventListener('keydown', recording.h, true); window.removeEventListener('keyup', recording.h, true);
    const ev = recording.ev, still = [...recording.down].reverse(); recording = null;
    for (const c of still) ev.push([3, c]); // release keys whose keyup never arrived
    const bytes = [];
    for (let i = 0; i < ev.length; i++){
      const [t, c] = ev[i];
      if (t === 2 && ev[i+1] && ev[i+1][0] === 3 && ev[i+1][1] === c && !(c >= 0xE0 && c <= 0xE7)){ bytes.push(1, 1, c); i++; }
      else bytes.push(1, t, c);
    }
    const txt = macroDecode(bytes);
    ta.value += txt; ta.dispatchEvent(new Event('input'));
    btn.textContent = '● Record from keyboard'; btn.classList.remove('rec');
    toast(txt ? 'Macro recorded' : 'No keys were recorded');
    return;
  }
  const ev = [], down = new Set();
  const h = e => {
    if (e.target === btn) return;
    const c = CODE_TO_HID[e.code]; if (c == null) return;
    e.preventDefault(); e.stopPropagation();
    if (e.type === 'keydown'){ if (down.has(c)) return; down.add(c); ev.push([2, c]); return; }
    // macOS: while Cmd is held the browser sends no keyup for other keys → release them before Cmd
    if (c === 0xE3 || c === 0xE7) for (const o of [...down].reverse()) if (o < 0xE0){ down.delete(o); ev.push([3, o]); }
    if (!down.has(c)) return;
    down.delete(c); ev.push([3, c]);
  };
  recording = {ev, h, down};
  window.addEventListener('keydown', h, true); window.addEventListener('keyup', h, true);
  btn.textContent = '■ Stop recording'; btn.classList.add('rec'); btn.blur();
  toast('Recording… type, then click "Stop recording"');
}

  if (data.keycodeVersion && data.keycodeVersion !== S.KC.ver && !confirm(`This file was made with keycode table v${data.keycodeVersion}; the keyboard uses v${S.KC.ver}. Load it anyway (converting by key name)?`)) return;

      for (const ent of data.layers[l]){
        const k = S.keys.find(k => `${k.row},${k.col}` === ent.rc); if (!k) continue;

        if (S.keymap[l][k.row*C + k.col] !== code){ await S.t.send([CMD.KM_SET, l, k.row, k.col, code >> 8, code & 0xFF]); S.keymap[l][k.row*C + k.col] = code; changed++; }

}

      const r = await S.t.send([CMD.GET_KB, 0x03]);
      if (r[0] === CMD.UNHANDLED){ testMatrix = false; return; }
      for (const k of S.keys){ const on = (r[2 + k.row*bpr + (bpr-1-(k.col>>3))] >> (k.col & 7)) & 1; k.el.classList.toggle('hit', !!on); if (on) k.el.classList.add('was'); }
    } catch { testMatrix = false; return; }
    testTimer = setTimeout(tick, 40);
  };
  tick(); renderSel();
}
function stopTester(){ clearTimeout(testTimer); testTimer = null; testMatrix = false; for (const k of S.keys) k.el?.classList.remove('hit'); }

const CODE_TO_HID = (() => {
  const m = {Enter:0x28, Escape:0x29, Backspace:0x2A, Tab:0x2B, Space:0x2C, Minus:0x2D, Equal:0x2E, BracketLeft:0x2F, BracketRight:0x30, Backslash:0x31,
    Semicolon:0x33, Quote:0x34, Backquote:0x35, Comma:0x36, Period:0x37, Slash:0x38, CapsLock:0x39, PrintScreen:0x46, ScrollLock:0x47, Pause:0x48,
    Insert:0x49, Home:0x4A, PageUp:0x4B, Delete:0x4C, End:0x4D, PageDown:0x4E, ArrowRight:0x4F, ArrowLeft:0x50, ArrowDown:0x51, ArrowUp:0x52,
    NumLock:0x53, NumpadDivide:0x54, NumpadMultiply:0x55, NumpadSubtract:0x56, NumpadAdd:0x57, NumpadEnter:0x58, Numpad0:0x62, NumpadDecimal:0x63,
    IntlBackslash:0x64, ContextMenu:0x65, ControlLeft:0xE0, ShiftLeft:0xE1, AltLeft:0xE2, MetaLeft:0xE3, ControlRight:0xE4, ShiftRight:0xE5, AltRight:0xE6, MetaRight:0xE7};
  for (let i = 0; i < 26; i++) m['Key' + String.fromCharCode(65+i)] = 0x04 + i;
  for (let i = 1; i <= 9; i++){ m['Digit'+i] = 0x1D + i; m['Numpad'+i] = 0x58 + i; }
  m.Digit0 = 0x27;
  for (let i = 1; i <= 12; i++) m['F'+i] = 0x39 + i;
  for (let i = 13; i <= 24; i++) m['F'+i] = 0x68 + i - 13;
  return m;
})();
function keysFromEvent(e){
  const hid = CODE_TO_HID[e.code]; if (hid == null) return [];
  return S.keys.filter(k => getKc(0, k) === hid);
}
document.addEventListener('keydown', e => {
  if (S.page !== 'test' || recording || e.target.closest?.('input,textarea,select')) return;
  e.preventDefault();
  const last = $('#testLast'); if (last) last.textContent = `Last key: ${e.code}`;
  if (testMatrix) return;
  const ks = keysFromEvent(e);
  for (const k of ks) k.el.classList.add('hit','was');
  // macOS only sends a Caps Lock keyup when the lock turns off → clear the highlight after a moment
  if (e.code === 'CapsLock') setTimeout(() => ks.forEach(k => k.el.classList.remove('hit')), 250);
});
document.addEventListener('keyup', e => {
  if (S.page !== 'test' || testMatrix) return;
  // macOS: no keyup for other keys while Cmd is held → clear everything when Cmd is released
  if (e.code === 'MetaLeft' || e.code === 'MetaRight'){ for (const k of S.keys) k.el?.classList.remove('hit'); return; }
  for (const k of keysFromEvent(e)) k.el.classList.remove('hit');
});
window.addEventListener('blur', () => { for (const k of S.keys) k.el?.classList.remove('hit'); });

/* ====================================================================
   Startup
   ==================================================================== */
function renderAll(){ renderNav(); renderStage(); renderConfig(); }
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(renderStage, 120); });

(async function init(){
  /* Language: link back to the Vietnamese version */
  const altLang = (() => { const f = location.pathname.split('/').pop(); return f === 'en.html' ? './' : f.replace(/-en\.html$/i, '.html'); })();
  const lang = $('#langLink'); lang.href = altLang; lang.onclick = () => lsSet('aula.lang', 'vi');
  setTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
  $('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  let def = DEFAULT_DEF;
  const saved = lsGet('aula.def'); if (saved){ try { def = JSON.parse(saved); } catch {} }
  try { setDef(def); } catch { setDef(DEFAULT_DEF); }
  renderAll();
  document.fonts?.ready.then(() => { if (S.keys[0]?.el) repaint(); fitPalette(); }); // re-measure once the Inter font has loaded
  if (!('hid' in navigator)) return;
  navigator.hid.addEventListener('disconnect', e => { if (S.t && S.t.dev === e.device){ toast('The keyboard was unplugged', true); disconnect(); } });
  try {
    const vid = toInt(S.def.vendorId);
    const devs = (await navigator.hid.getDevices()).filter(d => d.vendorId === vid && d.collections.some(c => c.usagePage === 0xFF60));
    if (devs.length) await useTransport(new HidTransport(devs[0]));
  } catch {}
})();
</script>
